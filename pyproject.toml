[project]
name = "bohai-cage-risk"
version = "0.1.0"
description = "Local web platform for LSTM water-quality training, historical analysis, and forecasting"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    "torch>=2.3,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "openpyxl>=3.1,<4",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["httpx>=0.27,<1"]
